name: Atualizar indicadores

on:
  schedule:
    - cron: "0 9 * * 1"   # toda segunda, 06:00 de Brasília
  workflow_dispatch:       # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths: ["site/**", "etl/**", "dados/mandatos.csv"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Conferir tabela de governantes
        run: python etl/checar_mandatos.py

      - name: Testar acesso às fontes (diagnóstico)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          for u in https://apisidra.ibge.gov.br https://api.bcb.gov.br https://apidatalake.tesouro.gov.br \
                   http://tabnet.datasus.gov.br https://download.inep.gov.br http://www.ipeadata.gov.br \
                   https://www.gov.br https://terrabrasilis.dpi.inpe.br https://dataserver-coids.inpe.br \
                   https://api-comexstat.mdic.gov.br https://aplicacoes.mds.gov.br https://dados.ancine.gov.br \
                   https://api.salic.cultura.gov.br https://ftp.ibge.gov.br; do
            printf '%-45s ' "$u"; curl -s -o /dev/null -m 25 -w '%{http_code} %{time_total}s\n' "$u" || echo "sem resposta"
          done

      - name: Coletar fontes (cada uma isolada, até 40 min)
        if: github.event_name != 'push'
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          for f in $(python -c "from etl.rodar import FONTES; print(' '.join(FONTES))"); do
            echo "::group::$f"
            timeout 40m python -m etl.rodar "$f" || echo "[falha] $f (erro ou tempo esgotado; ficam os dados da última coleta boa)"
            echo "::endgroup::"
          done
          python -m etl.rodar --so-site

      - name: Regerar site (sem coletar)
        if: github.event_name == 'push'
        run: python -m etl.rodar --so-site

      - name: Gravar no repositório (trilha de auditoria)
        if: github.event_name != 'push'
        run: |
          git config user.name "atualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add dados site/dados.json
          if git diff --cached --quiet; then
            echo "nada mudou"
          else
            git commit -m "dados: coleta de $(date -u +%F)"
            git push
          fi

      - name: Montar site
        run: |
          mkdir -p _site
          cp -r site/index.html site/app.js site/estilo.css site/dados.json site/origem site/favicon.ico _site/
          cp -r dados _site/dados

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
